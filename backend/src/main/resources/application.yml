spring:
  application:
    name: law-annotation-system
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${APP_AUTH_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax

app:
  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  init-admin:
    enabled: ${APP_INIT_ADMIN_ENABLED:false}
    username: ${APP_INIT_ADMIN_USERNAME:}
    password: ${APP_INIT_ADMIN_PASSWORD:}
    name: ${APP_INIT_ADMIN_NAME:}
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
    annotator-username: ${APP_DEMO_ANNOTATOR_USERNAME:}
    annotator-password: ${APP_DEMO_ANNOTATOR_PASSWORD:}
  upload:
    dir: ${APP_UPLOAD_DIR:/app/data/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
