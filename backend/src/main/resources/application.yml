spring:
  application:
    name: law-annotation-system
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${APP_AUTH_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax

app:
  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  init-admin:
    enabled: ${APP_INIT_ADMIN_ENABLED:false}
    username: ${APP_INIT_ADMIN_USERNAME:}
    password: ${APP_INIT_ADMIN_PASSWORD:}
    name: ${APP_INIT_ADMIN_NAME:}
